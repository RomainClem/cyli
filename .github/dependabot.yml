version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    groups:
      types:
        patterns:
          - "@types/*"
      ox:
        patterns:
          - "oxlint"
          - "oxfmt"
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "ci"
