name: Canary publish

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled]

permissions:
  contents: read
  pull-requests: write
  id-token: write

jobs:
  canary:
    name: Publish canary release
    if: contains(github.event.pull_request.labels.*.name, 'canary')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node (for npm publish)
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Compute canary version
        id: version
        run: |
          base=$(node -p "require('./package.json').version")
          short=$(git rev-parse --short HEAD)
          canary="${base}-pr.${{ github.event.pull_request.number }}.${short}"
          echo "version=$canary" >> "$GITHUB_OUTPUT"

      - name: Update package version
        run: npm version --no-git-tag-version --allow-same-version "${{ steps.version.outputs.version }}"

      - name: Build
        run: bun run build

      - name: Publish canary
        run: npm publish --tag canary --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Comment install instructions
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: canary-publish
          message: |
            ### 🐤 Canary published

            ```bash
            npx cyli@${{ steps.version.outputs.version }} --help
            # or
            npm install -g cyli@canary
            ```
