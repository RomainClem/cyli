name-template: "v$RESOLVED_VERSION"
tag-template: "v$RESOLVED_VERSION"
template: |
  ## What's changed

  $CHANGES

  **Full changelog**: https://github.com/$OWNER/$REPOSITORY/compare/$PREVIOUS_TAG...v$RESOLVED_VERSION

categories:
  - title: "🚀 Features"
    labels:
      - "feature"
      - "enhancement"
  - title: "🐛 Bug fixes"
    labels:
      - "fix"
      - "bug"
  - title: "🔧 Maintenance"
    labels:
      - "chore"
      - "refactor"
      - "ci"
  - title: "📚 Documentation"
    labels:
      - "docs"
      - "documentation"
  - title: "📦 Dependencies"
    labels:
      - "dependencies"

change-template: "- $TITLE (#$NUMBER) @$AUTHOR"
change-title-escapes: '\<*_&'

version-resolver:
  major:
    labels: ["major", "breaking"]
  minor:
    labels: ["minor", "feature"]
  patch:
    labels: ["patch", "fix", "bug", "chore", "docs", "dependencies"]
  default: patch

exclude-labels:
  - "skip-changelog"
